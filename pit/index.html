<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pit stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root { --bg: rgba(6, 10, 30, 0.94); --card: #121a3a; --ink: #f2f5ff; --dim: #8f9bc7; --go: #00e5a8; --miss: #ff6b6b; --gold: #ffd166; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; overflow: hidden; }
  #root { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .25s; }
  #root.fading { opacity: 0; }
  #exit { position: fixed; top: 14px; left: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #ffffff14; color: var(--dim); font-size: 20px; cursor: pointer; }
  .label { font-family: 'Fredoka One', sans-serif; letter-spacing: 1px; color: var(--dim); font-size: 18px; text-transform: uppercase; }
  .gauge { width: 440px; display: flex; flex-direction: column; gap: 6px; }
  .tank { height: 18px; border-radius: 9px; background: #ffffff14; overflow: hidden; }
  .tank i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd166, #00e5a8); transition: width .3s; }
  .tankrow { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; color: var(--dim); }
  .tankrow b { color: var(--ink); }
  .factline { font-weight: 800; font-size: 17px; color: var(--dim); }
  .factline b { color: var(--gold); }
  .earn { color: var(--go); font-weight: 900; min-width: 60px; text-align: right; }
  .card { background: var(--card); border-radius: 26px; padding: 34px 46px 28px; min-width: 440px; text-align: center; box-shadow: 0 20px 60px #0008; }
  .fact { font-family: 'Fredoka One', sans-serif; font-size: 84px; line-height: 1; white-space: nowrap; }
  .fact .eq { color: var(--dim); }
  input { margin-top: 22px; width: 220px; font: 900 56px Nunito, sans-serif; text-align: center; color: var(--ink); background: #0a1030; border: 3px solid #2a3570; border-radius: 16px; padding: 6px 10px; outline: none; caret-color: var(--go); }
  input:focus { border-color: #4a5bd0; }
  .card.right { box-shadow: 0 0 0 4px var(--go), 0 20px 60px #0008; }
  .card.wrong { box-shadow: 0 0 0 4px var(--miss), 0 20px 60px #0008; }
  .hint { min-height: 26px; margin-top: 14px; font-weight: 800; font-size: 20px; color: var(--dim); }
  .hint.miss { color: var(--miss); }
  .fact.long { font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.3; white-space: normal; max-width: 640px; }
  .fact.mid { font-size: 56px; }
  .ask { color: var(--gold); font-weight: 800; font-size: 17px; margin-top: 10px; }
  #askhoot { margin-top: 2px; font: 800 16px Nunito, sans-serif; padding: 8px 16px; border-radius: 12px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
  #hootbox { width: min(640px, 92vw); background: #1b2550; border: 2px solid #a78bfa; border-radius: 18px; padding: 14px 16px; text-align: left; }
  .hb-gloss { color: var(--ink); font-weight: 700; font-size: 16px; line-height: 1.45; }
  .hb-say { color: #d9ccff; font-weight: 800; font-size: 17px; margin-top: 10px; min-height: 22px; }
  .hb-row { display: flex; gap: 8px; margin-top: 10px; }
  .hb-row input { flex: 1; font: 700 16px Nunito, sans-serif; padding: 8px 10px; border-radius: 10px; border: 2px solid #2a3570; background: #0a1030; color: var(--ink); margin: 0; width: auto; text-align: left; }
  .hb-row button { font: 800 15px Nunito, sans-serif; padding: 8px 12px; border-radius: 10px; border: 0; background: #a78bfa; color: #0a1030; cursor: pointer; }
  .gtitle { color: var(--gold); font-weight: 900; font-size: 16px; letter-spacing: .5px; }
  .gq { color: var(--ink); font-size: 21px; font-weight: 800; line-height: 1.4; margin: 6px auto 0; max-width: 620px; }
  .gsub { color: var(--dim); font-size: 17px; font-weight: 700; margin-top: 8px; }
  .gsub b { color: var(--ink); }
  .steps { text-align: left; margin: 10px auto 0; max-width: 600px; color: var(--ink); font-size: 17px; font-weight: 700; line-height: 1.5; }
  .steps li { margin: 2px 0; }
  .hint .pat { color: var(--ink); font-size: 17px; font-weight: 700; margin-top: 6px; opacity: .85; }
  .hint b { color: var(--ink); }
  .sub { color: var(--dim); font-weight: 700; font-size: 15px; min-height: 20px; }
  #go { display: none; margin-top: 6px; font: 900 20px Nunito, sans-serif; padding: 12px 26px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #00ffcc, #0088ff); color: #001a33; cursor: pointer; }
  .loading-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-right: 6px; animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .2; } }
</style>
</head>
<body>
<button id="exit" title="Back to arcade">←</button>
<div id="root">
  <div class="label" id="label">Pit stop</div>
  <div class="gauge" id="gauge"><div class="tank"><i id="tankfill"></i></div>
    <div class="tankrow"><span>⚡ Power <b id="tankms">0:00</b> / <span id="tankneed">3:00</span></span><span class="earn" id="earn"></span><span id="rates"></span></div></div>
  <div class="factline" id="factline"></div>
  <div class="card" id="card">
    <div class="fact" id="fact">&nbsp;</div>
    <input id="ans" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4" aria-label="Your answer">
    <div class="hint" id="hint">Type it + Enter</div>
  </div>
  <div class="sub" id="sub"></div>
  <button id="go">Start game →</button>
  <button id="askhoot" style="display:none">🦉 Ask Hoot</button>
  <div id="hootbox" style="display:none">
    <div class="hb-gloss" id="hbgloss"></div>
    <div class="hb-say" id="hbsay"></div>
    <div class="hb-row"><input id="hbq" placeholder="Ask Hoot a question…" autocomplete="off"><button id="hbsend">Ask</button><button id="hbmic" style="display:none" title="Hold to talk">🎤 Hold</button><button id="hbclose">Close</button></div>
  </div>
</div>

<script src="/env.js"></script>
<script src="/event-types.js"></script>
<script>window.__EVENT_SOURCE = 'arcade-hub-pit';</script>
<script src="/event-logger.js"></script>
<script src="/learning.js"></script>
<script src="/facts.js"></script>
<script src="/school.js"></script>
<script src="pit.js"></script>
</body>
</html>
