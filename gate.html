<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parker's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
   * Gate screen shown to Parker when an active blocking override is in
   * effect (homework_gate). DELIBERATELY GENERIC — no mention of
   * homework, mom, or grading. Parker should not feel singled out or
   * punished. He sees a friendly "no games right now, come back later"
   * message; mom sees the actual reason in her dashboard.
   */
  body {
    margin: 0;
    font-family: 'Nunito', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a0b3d, #0a0020);
    color: #fffbe6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .gate {
    max-width: 480px;
    padding: 48px 32px;
  }
  .gate-icon {
    font-size: 80px;
    margin-bottom: 24px;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .gate-title {
    font-family: 'Fredoka One', cursive;
    font-size: 36px;
    margin: 0 0 16px;
    color: #ffd76b;
  }
  .gate-sub {
    font-size: 18px;
    line-height: 1.5;
    color: #d4ccff;
    margin: 0 0 32px;
  }
  .check-again {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fffbe6;
    padding: 12px 24px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .check-again:hover { background: rgba(255,255,255,0.16); }
  .last-checked {
    margin-top: 16px;
    font-size: 12px;
    color: #8a82b8;
  }
</style>
</head>
<body>
<div class="gate">
  <div class="gate-icon">🌙</div>
  <h1 class="gate-title">No games right now</h1>
  <p class="gate-sub">
    Come back in a little while — your arcade will be open again soon.
  </p>
  <button class="check-again" onclick="checkAgain()">Check again</button>
  <div class="last-checked" id="last-checked">just checked</div>
</div>

<script>
  // Poll the override every 10 seconds so when mom clears the gate the
  // hub auto-refreshes within ~10s. The Realtime channel from Phase 1
  // is on the parent app side; we don't subscribe here to keep the gate
  // page minimal and dependency-free. Best-effort polling is enough.
  function checkAgain() {
    document.getElementById('last-checked').textContent = 'checking…';
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 200);
  }
  function tick() {
    const el = document.getElementById('last-checked');
    if (el) el.textContent = 'last checked just now — auto-refreshing every 10s';
  }
  tick();
  setInterval(() => {
    window.location.href = 'index.html';
  }, 10_000);
</script>
<script src="/env.js"></script>
<script src="/event-types.js"></script>
<script>window.__EVENT_SOURCE = 'arcade-hub-lobby';</script>
<script src="/event-logger.js"></script>
<script>
  if (window.arcadeLog && window.ARCADE_EVENT_TYPES) {
    window.arcadeLog.event(window.ARCADE_EVENT_TYPES.GATE_SHOWN, {}, { severity: 'audit' });
  }
</script>
</body>
</html>
