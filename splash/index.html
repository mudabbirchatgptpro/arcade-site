<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parker's Arcade — loading…</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: radial-gradient(ellipse at top, #1a8040 0%, #0a4020 50%, #001a0a 100%);
    color: #fff;
    font-family: -apple-system, 'Avenir Next', 'Helvetica Neue', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  /* Twinkling stars in the background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.6), transparent),
      radial-gradient(2.5px 2.5px at 80% 20%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,.5), transparent),
      radial-gradient(2px 2px at 90% 60%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 10% 50%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,.4), transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .stage {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    position: relative;
    z-index: 1;
  }

  /* Cat + ball scene */
  .scene {
    position: relative;
    width: 360px;
    height: 200px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .ground {
    position: absolute;
    bottom: 30px;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, rgba(255, 102, 204, 0.5), rgba(102, 221, 255, 0.5), transparent);
    border-radius: 4px;
  }

  .cat {
    position: absolute;
    bottom: 28px;
    left: 80px;
    font-size: 90px;
    line-height: 1;
    animation: catBounce 0.7s ease-in-out infinite;
    transform-origin: bottom center;
    filter: drop-shadow(0 10px 30px rgba(255, 102, 204, 0.4));
  }
  @keyframes catBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  .ball {
    position: absolute;
    bottom: 38px;
    left: 200px;
    font-size: 50px;
    line-height: 1;
    animation: ballRoll 1.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 16px rgba(102, 221, 255, 0.5));
  }
  @keyframes ballRoll {
    0%   { transform: translateX(0) rotate(0deg); }
    25%  { transform: translateX(60px) rotate(180deg); }
    50%  { transform: translateX(0) rotate(360deg); }
    75%  { transform: translateX(-60px) rotate(540deg); }
    100% { transform: translateX(0) rotate(720deg); }
  }

  /* Title */
  h1 {
    font-family: 'Fredoka One', 'Avenir Next', sans-serif;
    font-weight: 800;
    font-size: 56px;
    margin: 0;
    letter-spacing: 0.5px;
    text-align: center;
    background: linear-gradient(135deg, #ff66cc 0%, #66ddff 50%, #ffaa44 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(255, 102, 204, 0.3);
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  /* Loading dots */
  .loader {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .loader span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff66cc, #66ddff);
    animation: dotPulse 1.2s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(255, 102, 204, 0.6);
  }
  .loader span:nth-child(2) { animation-delay: 0.15s; }
  .loader span:nth-child(3) { animation-delay: 0.3s; }
  .loader span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  .subtitle {
    font-size: 22px;
    font-weight: 600;
    margin-top: 4px;
    color: rgba(255, 255, 255, 0.65);
    letter-spacing: 0.3px;
    animation: subtitleFade 2s ease-in-out infinite;
  }
  @keyframes subtitleFade {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="scene">
      <div class="ground"></div>
      <div class="cat">🐱</div>
      <div class="ball">⚽</div>
    </div>
    <h1>Parker's games are being cooked!</h1>
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="subtitle">Hang tight, Parker — getting your arcade ready</div>
  </div>
</body>
</html>
